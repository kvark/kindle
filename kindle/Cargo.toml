[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Isolated F32 block-matmul candidate; not the qualified Atari backend.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "70803c22dd23ee73150febb69aae77818c568ab4" }
# Match Meganeura's published dependency so GPU context types stay identical.
blade-graphics = "=0.9.0"
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
