[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.88"
description = "A DreamerV3 agent with frozen DINOv3 visual perception."
license = "MIT"

[dependencies]
meganeura = { git = "https://github.com/kvark/meganeura", rev = "d904e12e52af6910b041873cd203a5d5e5fd3b3c" }
# Pinned to the same Blade revision as Meganeura so their GPU context types
# remain identical at the perception/learner boundary.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "824d55fbd6485a102ee220553bc54a30c1af5936" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
