[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Upstream includes LeVJEPA frame-prefix attention and cache-write aliases.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "5f7e7cb160cc4aa080dbbfa30298ddca2e5a7e38" }
# Match the instrumented upstream candidate dependency in Meganeura exactly.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "aeb554e6daedc77d9f2ba487adc7cf4666d20970" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
