[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with causal visual perception."
license = "MIT"

[dependencies]
# Keep training correctness fixes and the shared Blade context on one pinned stack.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "679ea87cdd788e72103f1fa50fb9cea2c7392a0c" }
blade-graphics = { git = "https://github.com/kvark/blade", rev = "b52965b0360cee07bff6b17d2c2ea23d7455b8b1" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["socket", "uio"] }

[dev-dependencies]
naga = { git = "https://github.com/kvark/wgpu", rev = "c9fd6a85a87034ecb5a784611c6f90a14d8d50ce", features = ["wgsl-in"] }
