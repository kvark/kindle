[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.88"
description = "A DreamerV3 agent with frozen DINOv3 visual perception."
license = "MIT"

[dependencies]
meganeura = { git = "https://github.com/kvark/meganeura", rev = "bd6be0882c53b94f65f164f88464cc6b24e9df4d" }
# Pinned to the same Blade revision as Meganeura so their GPU context types
# remain identical at the perception/learner boundary.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "b208f3b1f97196c2971436b5726e61e71b149c37" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
