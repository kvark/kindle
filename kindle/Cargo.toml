[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Upstream includes LeVJEPA frame-prefix attention and cache-write aliases.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "75dfe901deb87ca0054c438437efd3aa388b7188" }
# Calibrated timings are not published yet; share Meganeura's exact context type.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "f6f2729e850cc0aefdc0bb18523da58a72765169" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
