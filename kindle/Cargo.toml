[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.88"
description = "A DreamerV3 agent with frozen DINOv3 visual perception."
license = "MIT"

[dependencies]
meganeura = { git = "https://github.com/kvark/meganeura", rev = "b2cc25638127c64944f96c2aeea7bf8e5c124691" }
# Pinned to the same Blade revision as Meganeura so their GPU context types
# remain identical at the perception/learner boundary.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "a6ae6a73219762f63efb4e5be4550fbc0d301b2f" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
