[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Upstream includes LeVJEPA frame-prefix attention and cache-write aliases.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "070f4b51a5c9936f3cdbb0ab87efa654bd86cf5c" }
# Match the instrumented upstream candidate dependency in Meganeura exactly.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "100bb813d8b66b120e9a28e2c533227d0db64cd0" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
