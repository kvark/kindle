[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with causal visual perception."
license = "MIT"

[dependencies]
# Keep training correctness fixes and the shared Blade context on one pinned stack.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "a0eff600d0aaf877a6a6ba02c2de1eb8804583ed" }
blade-graphics = { git = "https://github.com/kvark/blade", rev = "d9112e26ab1244d9e206e7d27387295a28cb3fa3" }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["socket", "uio"] }

[dev-dependencies]
libloading = "0.8"
naga = { git = "https://github.com/kvark/wgpu", rev = "9964733300924e724b6d41ef268e7c2933f3dcdb", default-features = false, features = ["wgsl-in", "spv-out"] }
