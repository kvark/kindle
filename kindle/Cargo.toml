[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with causal visual perception."
license = "MIT"

[dependencies]
# Keep training correctness fixes and the shared Blade context on one pinned stack.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "423d373634a1b1f04ff623db2b419757f1e8d96d" }
blade-graphics = { git = "https://github.com/kvark/blade", rev = "bbbc93b7d26b8196d9143944fe7d8a61d6da4583" }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["socket", "uio"] }

[dev-dependencies]
libloading = "0.8"
naga = { git = "https://github.com/kvark/wgpu", rev = "13f582ddd2792befb46952498010248bd65818e6", features = ["wgsl-in", "spv-out"] }
