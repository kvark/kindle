[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Keep training correctness fixes and the shared Blade context on one pinned stack.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "4cbcd69b9bf892288e695e7341c583ec16c813a6" }
blade-graphics = { git = "https://github.com/kvark/blade", rev = "a78618069780a653d443cb0ddf61e207cb226043" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["socket", "uio"] }

[dev-dependencies]
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "323acfb729a00c3030e362faa27252afe6368792", features = ["wgsl-in"] }
