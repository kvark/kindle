[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Upstream includes LeVJEPA frame-prefix attention and cache-write aliases.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "9b9e7ee7ebdb27764a16f87860e4e227a93387cc" }
# Match the instrumented published-control dependency in Meganeura exactly.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "c96a9a87ad47d525467f9b41c17ce480ff876240" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
