[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with causal visual perception."
license = "MIT"

[dependencies]
# Keep training correctness fixes and the shared Blade context on one pinned stack.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "5a493322af7569a057f3c8db3ff73c1ca10680b2" }
blade-graphics = { git = "https://github.com/kvark/blade", rev = "663afd2194069af25c5be884e90c3d53e83a3973" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["socket", "uio"] }

[dev-dependencies]
libloading = "0.8"
naga = { git = "https://github.com/kvark/wgpu", rev = "c9fd6a85a87034ecb5a784611c6f90a14d8d50ce", features = ["wgsl-in"] }
