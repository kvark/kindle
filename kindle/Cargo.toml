[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[features]
profiler = ["meganeura/profiler", "dep:tracing"]

[dependencies]
# Keep training correctness fixes and the shared Blade context on one pinned stack.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "ee3aea42da8e3e7b63d4083d0ea35b09848872ad" }
blade-graphics = { git = "https://github.com/kvark/blade", rev = "fbb4f28c4869e81ae15de58925945b423b9c1ac5" }
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
tracing = { version = "0.1", optional = true }
