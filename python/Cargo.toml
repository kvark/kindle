[package]
name = "kindle-py"
version = "0.3.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for Kindle's DreamerV3 agent."
license = "MIT"
publish = false

[lib]
# Named `_native` to avoid a symbol collision with the `kindle` crate dep.
# The Python-side import path (`kindle._native`) is set in pyproject.toml.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
kindle = { path = "../kindle", version = "0.1" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = "1"
serde_json = "1"
