[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kindle"
version = "0.3.0"
description = "DreamerV3 with frozen DINOv3 perception on a native GPU stack."
authors = [{ name = "Dzmitry Malyshau" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
gym = ["gymnasium>=1.1,<2"]
atari = [
  "gymnasium[atari]>=1.1,<2",
  "pillow>=10",
]
arc = [
  "arc-agi==0.9.8; python_version >= '3.12'",
  "arcengine==0.9.3; python_version >= '3.12'",
]
test = ["pytest>=8", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/kvark/kindle"

[tool.maturin]
# Native extension is installed at `kindle._native`; the pure-Python
# shim at `kindle/__init__.py` re-exports the public surface so users
# just write `import kindle`.
module-name = "kindle._native"
python-source = "."
features = ["pyo3/extension-module"]
