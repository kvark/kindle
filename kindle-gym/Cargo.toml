[package]
name = "kindle-gym"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.88"
description = "Native visual smoke-test environments for Kindle."
license = "MIT"

[dependencies]
kindle = { path = "../kindle", version = "0.1" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
rand = "0.9"
serde_json = "1"
