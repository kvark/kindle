name: CI
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (lavapipe)
            os: ubuntu-latest
          - name: macOS (Metal)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install lavapipe and Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

      # DINO weights are separately licensed and unavailable in CI. This
      # synthetic observation canary still executes the complete Dreamer
      # acting, learning, optimizer, checkpoint, and restore path.
      - name: Dreamer GPU canary
        if: runner.os == 'Linux'
        run: >-
          cargo test -p kindle tiny_agent_completes_an_act_and_learn_cycle
          --lib -- --ignored

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install lavapipe and Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python

      - name: Rust formatting and Clippy
        run: |
          cargo fmt --manifest-path python/Cargo.toml -- --check
          cargo clippy --manifest-path python/Cargo.toml \
            --all-targets -- -D warnings

      - name: Build and install extension
        working-directory: python
        run: |
          python -m venv ../.venv
          . ../.venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          maturin develop --release --extras test

      - name: Pytest
        run: |
          . .venv/bin/activate
          pytest python/tests -q
