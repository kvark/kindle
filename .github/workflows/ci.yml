name: CI
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (lavapipe)
            os: ubuntu-latest
          - name: macOS (Metal)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install lavapipe and Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --all-targets

      # Synthetic observations exercise the learner without pretrained weights.
      - name: Dreamer GPU canaries
        if: runner.os == 'Linux'
        run: >-
          cargo test -p kindle tiny_
          --lib -- --ignored --skip vision:: --test-threads=1

      - name: GPU pixel preprocessing and resident-buffer parity
        run: >-
          cargo test -p kindle --lib
          vision::preprocess_gpu::tests::gpu_pixels_match_cpu_reference_and_resident_buffers
          -- --exact --ignored --test-threads=1

      - name: GPU acting, masks, independent streams and replay parity
        if: runner.os == 'Linux'
        run: >-
          cargo test -p kindle --lib dreamer::agent::vector::tests::
          -- --ignored --test-threads=1

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.11"

      - name: Generate synthetic causal encoder reference
        if: runner.os == 'Linux'
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python -m venv .reference-venv
          .reference-venv/bin/pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          .reference-venv/bin/pip install numpy==2.3.3 safetensors==0.6.2 packaging==25.0
          # Generated references are inputs, not reusable Cargo cache artifacts.
          reference_root=$(mktemp -d "$RUNNER_TEMP/kindle-reference.XXXXXX")
          .reference-venv/bin/python python/examples/levjepa_tiny_reference.py "$reference_root/training"
          .reference-venv/bin/python python/examples/levjepa_tiny_streaming_reference.py "$reference_root/training" "$reference_root/stream"
          echo "KINDLE_TINY_STREAM_REFERENCE=$reference_root/stream" >> "$GITHUB_ENV"

      - name: Causal encoder parity, chunk wrap and independent stream resets
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: >-
          cargo test -p kindle --lib
          vision::levjepa::tests::tiny_synthetic_streaming_matches_dense_reference
          -- --exact --ignored --test-threads=1

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install lavapipe and Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python

      - name: Rust formatting and Clippy
        run: |
          cargo fmt --manifest-path python/Cargo.toml -- --check
          cargo clippy --manifest-path python/Cargo.toml \
            --all-targets -- -D warnings

      - name: Build and install extension
        working-directory: python
        run: |
          python -m venv ../.venv
          . ../.venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          maturin develop --release --extras test

      - name: Pytest
        run: |
          . .venv/bin/activate
          pytest python/tests -q
