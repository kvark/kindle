name: CI
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (lavapipe)
            os: ubuntu-latest
          - name: macOS (Metal)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install lavapipe and Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Reward signal tests
        run: cargo test -p kindle --test reward_signal

      # Hard gate: these suites are #[ignore]d and run nowhere else
      # (Confidence Plan Tiers 2/3/5). They pass under lavapipe in ~4 min.
      # Scoped to Linux: the macOS/Metal leg was never verified for these
      # suites (the step was previously vacuous via continue-on-error);
      # re-enable on macOS once a green Metal run is demonstrated.
      - name: GPU tests (opt parity + canaries + stability)
        if: runner.os == 'Linux'
        run: |
          cargo test -p kindle \
            --test opt_parity --test canaries --test wm_direction -- --ignored
          cargo test -p kindle-gym --test stability -- --ignored

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install lavapipe and Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python

      - name: Rust formatting and Clippy
        run: |
          cargo fmt --manifest-path python/Cargo.toml -- --check
          cargo clippy --manifest-path python/Cargo.toml \
            --all-targets -- -D warnings

      - name: Build and install extension
        working-directory: python
        run: |
          python -m venv ../.venv
          . ../.venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          maturin develop --release --extras test,atari

      - name: Pytest
        run: |
          . .venv/bin/activate
          pytest python/tests -q
